name = "lifeos-agents"
main = "src/index.js"
compatibility_date = "2026-10-21"

[ai]
binding = "AI"

# Optional: enable session memory by creating a KV namespace and replacing the ID.
# [[kv_namespaces]]
# binding = "AGENT_MEMORY"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true

# Configure a random secret before using authenticated endpoints:
# npx wrangler secret put AGENT_API_KEY
